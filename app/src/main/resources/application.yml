server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flood-monitor-api
  
  jackson:
    serialization:
      indent-output: true

  mvc:
    contentnegotiation:
      default-content-types:
        - application/json

simulation:
  enabled: true
  interval: 10000

  water-level-variance: 5.0
  rainfall-variance: 2.0
  battery-drain-rate: 0.1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.yourpackage.floodmonitor: DEBUG 